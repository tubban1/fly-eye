name: Publish npm packages

on:
  push:
    branches: [main]
    paths:
      - ".publish/npm-v0.1.0"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use current npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Install and test workspace
        run: |
          npm install
          npm test

      - name: Publish graph-core
        run: npm publish --workspace @fly-eye/graph-core --access public

      - name: Publish runtime
        run: npm publish --workspace @fly-eye/runtime --access public

      - name: Publish escape-neuron-v1
        run: npm publish --workspace @fly-eye/escape-neuron-v1 --access public

      - name: Publish connectome-tools
        run: npm publish --workspace @fly-eye/connectome-tools --access public

      - name: Publish benchmarks
        run: npm publish --workspace @fly-eye/benchmarks --access public
