name: Publish Python SDK to PyPI

on:
  push:
    branches: [main]
    paths:
      - ".publish/pypi-v0.1.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python SDK
        run: python -m unittest discover -s packages/python-sdk/tests -p "test_*.py"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          cd packages/python-sdk
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: packages/python-sdk/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
