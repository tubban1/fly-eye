[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flyeye-graphs"
version = "0.1.0"
description = "Python loaders for FlyEye connectome profiles and FLYGRAPH binaries"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FlyEye"}]
dependencies = []

[project.optional-dependencies]
networkx = ["networkx>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]
