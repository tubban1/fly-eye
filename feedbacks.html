<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>FlyEye Feedback Inbox</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}
    body{margin:0;background:#0b0b0b;color:#f6f0e4}
    main{width:min(1100px,calc(100% - 32px));margin:40px auto 80px}
    header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
    h1{font-size:clamp(34px,6vw,64px);margin:0;letter-spacing:-.055em} h1 span{color:#dfff55}
    p{color:#9e9e98}.auth{display:flex;gap:8px;max-width:520px;margin:18px 0 28px}
    input,button,select{background:#151515;color:#f6f0e4;border:1px solid #343434;border-radius:999px;padding:11px 14px}
    input{flex:1}button{cursor:pointer;font-weight:800}button:hover{border-color:#dfff55}
    #status{font-size:12px;color:#aaa;margin-bottom:14px}
    .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .entry{border:1px solid #252525;border-radius:18px;padding:16px;margin:10px 0;background:#111}
    .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#8f8f89;font-size:12px}
    .tag{color:#dfff55;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
    .message{white-space:pre-wrap;line-height:1.5;margin:12px 0;font-size:15px}
    .contact{font-size:12px;color:#c7c7bf}.empty{padding:34px;border:1px dashed #333;border-radius:18px;color:#777}
  </style>
</head>
<body>
<main>
  <header><div><p>PRIVATE ADMIN VIEW</p><h1>FlyEye <span>Feedback</span></h1></div><a href="/" style="color:#dfff55">← FlyEye</a></header>
  <div class="auth">
    <input id="token" type="password" placeholder="FEEDBACK_ADMIN_TOKEN" autocomplete="current-password" />
    <button id="load">LOAD</button>
  </div>
  <div class="filters">
    <select id="filter">
      <option value="">All feedback</option>
      <option value="bug">Bug / problem</option>
      <option value="idea">Idea / suggestion</option>
      <option value="science">Scientific feedback</option>
      <option value="other">Other</option>
    </select>
  </div>
  <div id="status">Enter the admin token to load feedback.</div>
  <section id="list"></section>
</main>
<script>
const tokenEl=document.querySelector('#token'),list=document.querySelector('#list'),status=document.querySelector('#status'),filter=document.querySelector('#filter');
tokenEl.value=sessionStorage.getItem('flyeye_feedback_token')||'';
let entries=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
  const selected=filter.value;
  const rows=selected?entries.filter(e=>e.category===selected):entries;
  list.innerHTML=rows.length?rows.map(e=>`
    <article class="entry">
      <div class="meta"><span><b class="tag">${esc(e.category)}</b> · ${new Date(e.created_at).toLocaleString()}</span><span>${esc(e.mode||'—')}</span></div>
      <div class="message">${esc(e.message)}</div>
      <div class="contact">${e.display_name?'<b>'+esc(e.display_name)+'</b> · ':''}${e.contact?esc(e.contact):'No contact'}${e.page_path?' · '+esc(e.page_path):''}</div>
    </article>`).join(''):'<div class="empty">No feedback in this view.</div>';
}
async function load(){
  const token=tokenEl.value.trim(); if(!token){status.textContent='Token required.';return}
  status.textContent='Loading…';
  try{
    const r=await fetch('/api/feedback?limit=200',{headers:{authorization:'Bearer '+token}});
    if(!r.ok) throw new Error(r.status===401?'Invalid token or FEEDBACK_ADMIN_TOKEN is not configured.':'Request failed: '+r.status);
    const data=await r.json();entries=data.entries||[];sessionStorage.setItem('flyeye_feedback_token',token);
    status.textContent=entries.length+' feedback item'+(entries.length===1?'':'s');render();
  }catch(err){status.textContent=err.message;list.innerHTML=''}
}
document.querySelector('#load').onclick=load;filter.onchange=render;tokenEl.onkeydown=e=>{if(e.key==='Enter')load()};
if(tokenEl.value) load();
</script>
</body>
</html>
